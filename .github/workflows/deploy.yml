# Builds the web site (explorer, data entry tool, data files of every released
# version) and publishes it with GitHub Pages.
#
# One-time set-up by an owner of the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# GitHub Pages needs a public repository (or a paid plan).  While the
# repository is private the site is still built and kept as an artifact of the
# run, but not published; set the repository variable DEPLOY_PAGES to "true"
# to publish from a private repository on a plan that allows it.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # all history and tags: released versions are built from their tags
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Python requirements
        run: pip install -r requirements.txt

      - name: Validate the data
        run: python tools/mund.py validate

      - name: Build the site
        run: python tools/mund.py build --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private || vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
