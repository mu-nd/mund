# Checks every change to the database and to the tools.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Python requirements
        run: pip install -r requirements.txt

      - name: Validate the data (format, identifiers, references)
        run: python tools/mund.py validate

      - name: Files are in canonical layout
        run: python tools/mund.py format --check

      - name: Tests of the Python tools
        run: python -m unittest discover -s tests/python -t tests/python -v

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tests of the browser code
        run: node tests/js/run-node.mjs
