# What this does and its one-time set-up: docs/deployment.ja.md §1-2
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # history and tags: the version is described, the frozen releases are checked
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      - run: python tools/mund.py validate
      - run: python tools/mund.py releases
      - run: python -m unittest discover -s tests/python
      - run: node tests/js/run-node.mjs
      - run: python tools/mund.py build --out _site
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  py39:
    runs-on: ubuntu-24.04       # has Python 3.9 builds
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/python

  deploy:
    needs: [check, py39]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
